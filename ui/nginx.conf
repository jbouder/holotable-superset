server {
  listen 3000;
  root /usr/share/nginx/html;

  # The API, same origin: /api/dashboards -> api:8000/dashboards.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    # Server-sent events from POST /chat (M4) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
