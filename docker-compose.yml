# Holotable on Superset POC.
# Start everything with `docker compose up` from this directory.
# Local-only defaults below; override any of them in .env.

x-superset-env: &superset-env
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-dev-only-change-me-0f6c2b1e9a}
  POSTGRES_USER: ${POSTGRES_USER:-superset}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superset}
  POSTGRES_HOST: superset-db
  REDIS_URL: redis://redis:6379
  SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
  SUPERSET_SERVICE_USERNAME: ${SUPERSET_SERVICE_USERNAME:-holotable_svc}
  SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:-holotable_svc}

x-superset: &superset
  image: apache/superset:6.1.0-dev
  environment: *superset-env
  volumes:
    - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ./superset/init.sh:/app/holotable/init.sh:ro
    - ./superset/init_service_account.py:/app/holotable/init_service_account.py:ro

services:
  superset-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superset}
      POSTGRES_DB: superset
    volumes:
      - superset-db:/var/lib/postgresql/data
      - ./superset/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d superset"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  superset-init:
    <<: *superset
    command: ["bash", "/app/holotable/init.sh"]
    depends_on:
      superset-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  superset:
    <<: *superset
    command: ["/usr/bin/run-server.sh"]
    ports:
      - "8088:8088" # published only for debugging; the demo never opens it
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  superset-mcp:
    <<: *superset
    command: ["superset", "mcp", "run", "--host", "0.0.0.0", "--port", "5008"]
    ports:
      - "5008:5008"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      # The MCP server has no HTTP health route; a POST without a session still
      # proves it is listening and speaking MCP.
      test:
        - CMD-SHELL
        - >-
          curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5008/mcp
          -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream'
          -d '{"jsonrpc":"2.0","id":1,"method":"ping"}' | grep -qv '^000$'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-superset}:${POSTGRES_PASSWORD:-superset}@superset-db:5432/holotable
      REDIS_URL: redis://redis:6379/3
      SUPERSET_URL: http://superset:8088
      SUPERSET_SERVICE_USERNAME: ${SUPERSET_SERVICE_USERNAME:-holotable_svc}
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:-holotable_svc}
      # The agent reaches Superset's MCP server per run, so saved dashboards
      # still load while superset-mcp is stopped.
      SUPERSET_MCP_URL: http://superset-mcp:5008/mcp
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_EFFORT: ${LLM_EFFORT:-medium}
      AGENT_TIME_LIMIT: ${AGENT_TIME_LIMIT:-180}
    ports:
      - "8000:8000"
    depends_on:
      superset:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Local LLM (profile local-llm): Ollama on the Docker network, so an agent
  # run makes no outbound calls. Set LLM_PROVIDER=ollama in .env.
  ollama:
    image: ollama/ollama:0.21.0
    profiles: ["local-llm"]
    volumes:
      - ${OLLAMA_MODELS:-ollama-models}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: download the model once. It is the only step that needs the network.
  ollama-pull:
    image: ollama/ollama:0.21.0
    profiles: ["local-llm"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen3.5:35b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:
  superset-db:
