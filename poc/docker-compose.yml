# Holotable on Superset POC.
# Start everything with `docker compose up` from this directory.
# Local-only defaults below; override any of them in .env.

x-superset-env: &superset-env
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-dev-only-change-me-0f6c2b1e9a}
  POSTGRES_USER: ${POSTGRES_USER:-superset}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superset}
  POSTGRES_HOST: superset-db
  REDIS_URL: redis://redis:6379
  SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
  SUPERSET_SERVICE_USERNAME: ${SUPERSET_SERVICE_USERNAME:-holotable_svc}
  SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:-holotable_svc}

x-superset: &superset
  image: apache/superset:6.1.0-dev
  environment: *superset-env
  volumes:
    - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ./superset/init.sh:/app/holotable/init.sh:ro
    - ./superset/init_service_account.py:/app/holotable/init_service_account.py:ro

services:
  superset-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superset}
      POSTGRES_DB: superset
    volumes:
      - superset-db:/var/lib/postgresql/data
      - ./superset/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d superset"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  superset-init:
    <<: *superset
    command: ["bash", "/app/holotable/init.sh"]
    depends_on:
      superset-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  superset:
    <<: *superset
    command: ["/usr/bin/run-server.sh"]
    ports:
      - "8088:8088" # published only for debugging; the demo never opens it
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  superset-mcp:
    <<: *superset
    command: ["superset", "mcp", "run", "--host", "0.0.0.0", "--port", "5008"]
    ports:
      - "5008:5008"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      # The MCP server has no HTTP health route; a POST without a session still
      # proves it is listening and speaking MCP.
      test:
        - CMD-SHELL
        - >-
          curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5008/mcp
          -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream'
          -d '{"jsonrpc":"2.0","id":1,"method":"ping"}' | grep -qv '^000$'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  superset-db:
